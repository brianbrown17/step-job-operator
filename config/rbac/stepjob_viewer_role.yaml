# permissions for end users to view stepjobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: step-job-operator
    app.kubernetes.io/managed-by: kustomize
  name: stepjob-viewer-role
rules:
- apiGroups:
  - batch.step-job-operator.kubebuilder.io
  resources:
  - stepjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch.step-job-operator.kubebuilder.io
  resources:
  - stepjobs/status
  verbs:
  - get
